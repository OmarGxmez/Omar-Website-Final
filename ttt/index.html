<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <h1>Tic-Tac-Toe</h1>

    <!-- Player Name Setup Form -->
    <form id="setup-form" class="setup-form">
      <div class="input-group">
        <label for="p1-input">Player 1 (X):</label>
        <input type="text" id="p1-input" placeholder="Player 1 Name" required>
      </div>
      <div class="input-group">
        <label for="p2-input">Player 2 (O):</label>
        <input type="text" id="p2-input" placeholder="Player 2 Name" required>
      </div>
      <button type="submit" id="start-btn">Start Game</button>
    </form>

    <!-- Scoreboard Section -->
    <section class="scoreboard hidden" id="scoreboard">
      <div class="score-card">
        <span id="p1-display">Player 1</span>
        <span id="p1-score" class="score">0</span>
      </div>
      <div class="score-card">
        <span>Ties</span>
        <span id="ties-score" class="score">0</span>
      </div>
      <div class="score-card">
        <span id="p2-display">Player 2</span>
        <span id="p2-score" class="score">0</span>
      </div>
    </section>

    <!-- DOM Status Message (NO alert popups) -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Game Board Grid -->
    <div id="board" class="board hidden">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <!-- Play Again Button -->
    <button id="play-again-btn" class="play-again-btn hidden">Play Again</button>
  </main>
</body>
</html>
