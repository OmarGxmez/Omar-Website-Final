<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Assignment</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-container">
        <h1>Welcome to Your Birthday Profile!</h1>
        <hr>
        <p class="greeting">Hello, <span id="displayName">---</span>!</p>
        
        <div class="info-box">
            <p><strong>Age:</strong> <span id="displayAge">---</span> years old</p>
            <p><strong>Birth Month:</strong> <span id="displayMonth">---</span></p>
            <p><strong>Season:</strong> <span id="displaySeason">---</span></p>
            <p><strong>Birthstone:</strong> <span id="displayStone">---</span></p>
        </div>

        <p id="summaryText" class="summary-paragraph"></p>
    </div>

    <!-- Link to external JavaScript at the bottom of body -->
    <script src="js/script.js"></script>
</body>
</html>
