<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Pure CSS Sunset Landscape with a House</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="canvas">
        <div class="sun"></div>
        <div class="cloud-left"></div>
        <div class="cloud-right"></div>
        <div class="ground"></div>
        <div class="house-base"></div>
        <div class="house-roof"></div>
        <div class="door"></div>
        <div class="window-left"></div>
        <div class="window-right"></div>
        <div class="tree-trunk"></div>
        <div class="tree-leaves"></div>
        <div class="bush-left"></div>
        <div class="bush-right"></div>
        <div class="fence-post-1"></div>
        <div class="fence-post-2"></div>
        <div class="fence-post-3"></div>
    </div>

</body>
</html>
