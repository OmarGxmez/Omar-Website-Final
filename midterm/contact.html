    <main>
        <p>Have a question or feedback about an order? Get in touch with our team using the form below.</p>
        <img src="img/pizza-main.png" alt="Contact Us" width="400">

        <form action="https://www.stonecoldprofessor.com/pizza-contact.php" method="POST">
            
            <p>
                28    <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name">
            </p>

            <p>
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name">
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="text" id="email" name="email">
            </p>

            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message"></textarea>
            </p>

            <p>
                <input type="submit" value="Send">
                <input type="reset" value="Clear">
            </p>

        </form>
